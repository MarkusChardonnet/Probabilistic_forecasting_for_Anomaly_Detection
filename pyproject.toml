[tool.uv.sources]
# v2.2.0's build configuration points to a nonexistent telegram_bot module.
telegram-bot = { git = "https://github.com/FlorianKrach/Telegram-Bot-Install.git", tag = "v2.1.0" }

[tool.uv.extra-build-dependencies]
# iisignature imports NumPy in setup.py without declaring it for isolated builds.
iisignature = [{ requirement = "numpy", match-runtime = true }]
